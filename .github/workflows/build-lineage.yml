name: Build LineageOS 14.1 (ios6737t / MT6737T)

# 相比 TWRP，源码大一个数量级（cm-14.1 全量约 15-25GB），编译时间也长得多。
#
# 关于诊断：Actions 的日志与 artifacts 都需要认证才能下载，而 Release 资产
# 是公开直链。所以这里把关键诊断写进 build-report.txt，并在 always() 时
# 作为 Release 资产发布 —— 无论成败都能拿到现场信息。

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner 标签"
        required: true
        default: "ubuntu-22.04"
      apply_telephony:
        description: "套用本机国行双基带电话配置(需搭配本机 blobs，否则 RIL 可能崩)"
        required: true
        default: "1"
      build_target:
        description: "构建目标 (bacon / systemimage)"
        required: true
        default: "bacon"
      allow_missing_deps:
        description: "开启 ALLOW_MISSING_DEPENDENCIES(会静默剔除模块，通常应保持 0)"
        required: true
        default: "0"
  push:
    branches: [main]
    paths:
      - "lineage/**"
      - ".github/workflows/build-lineage.yml"

jobs:
  build:
    name: Build LineageOS 14.1
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-22.04' }}
    timeout-minutes: 355
    permissions:
      contents: write

    # 关键：默认 shell 加上 pipefail。
    # 上一次构建之所以"成功"却无产物，就是因为 `cmd | tail` 的退出码取自 tail，
    # 脚本失败被完全掩盖。
    defaults:
      run:
        shell: bash -eo pipefail {0}

    env:
      REPORT: ${{ github.workspace }}/build-report.txt

    steps:
      - name: Checkout overrides
        uses: actions/checkout@v4
        with:
          path: own

      - name: Init report
        run: |
          {
            echo "===== LineageOS 14.1 构建报告 ====="
            echo "run_number : ${{ github.run_number }}"
            echo "commit     : ${{ github.sha }}"
            echo "runner     : ${{ github.event.inputs.runner || 'ubuntu-22.04' }}"
            echo "target     : ${{ github.event.inputs.build_target || 'bacon' }}"
            echo "telephony  : ${{ github.event.inputs.apply_telephony || '1' }}"
            echo
          } | tee "$REPORT"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libwxgtk3.0-gtk3-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip unzip zlib1g-dev python2 \
            python3 openssl libelf-dev
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          { echo "--- 环境 ---"; python --version 2>&1; java -version 2>&1;
            echo "nproc=$(nproc)  mem=$(free -g | awk '/Mem:/{print $2}')GB";
            df -h / | tail -1; echo; } | tee -a "$REPORT"

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-los141-${{ github.run_number }}
          restore-keys: ccache-los141-

      - name: Sync LineageOS cm-14.1
        run: |
          git config --global user.name  "github-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false
          mkdir -p los && cd los
          repo init --depth=1 --no-repo-verify \
            -u https://github.com/LineageOS/android.git -b cm-14.1
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune
          { echo "--- sync 结果 ---"
            echo "源码大小: $(du -sh . | cut -f1)"
            echo "顶层目录: $(ls | tr '\n' ' ')"
            for d in build vendor/cm frameworks/base system/core prebuilts/sdk/tools; do
              [ -d "$d" ] && echo "  存在 $d" || echo "  !! 缺失 $d"
            done
            echo; } | tee -a "$REPORT"

      - name: Clone device and vendor trees
        run: |
          cd los
          git clone --depth=1 https://github.com/seluce/android_device_cubot_x18 \
            -b los-14.1 device/CUBOT/X18
          git clone --depth=1 https://github.com/seluce/android_vendor_cubot_x18 \
            -b los-14.1 vendor/CUBOT/X18
          { echo "--- 上游设备树与 blobs ---"
            echo "device 文件: $(ls device/CUBOT/X18 | tr '\n' ' ')"
            echo "上游 vendor: $(find vendor/CUBOT/X18 -type f | wc -l) 个, $(du -sh vendor/CUBOT/X18 | cut -f1)"
            echo; } | tee -a "$REPORT"

      # 上一版 ROM 卡在开机第一屏无限重启，根因是用了 Cubot X18 的 blobs：
      # 其 HAL 命名为 *.mt6735t.so，而本机 ro.board.platform=mt6737t，
      # HAL 实际叫 *.mt6737t.so —— 名字对不上，Android 加载不到，服务起不来。
      # 这里整棵换成从本机 stock system.img 提取的真实 blobs。
      - name: Replace vendor blobs with the device's own
        run: |
          cd los
          V=vendor/CUBOT/X18
          # 只替换 blob 文件本身，保留上游的两样东西：
          #   Android.mk —— 把 libdpframework / libaudiocustparam / libmtkcam_fwkutils
          #     声明为预编译 SHARED_LIBRARIES，否则 libstagefright 之类链接不到，
          #     构建会报 "export_includes ... missing and no known rule to make it"
          #   libstagefright_color_conversion/ —— 构建期用的 .a 静态库，
          #     ROM 里本来就不存在，无法从本机 system.img 提取
          rm -rf "$V/vendor" "$V/lib" "$V/bin" "$V/etc" "$V/usr" "$V/X18-vendor.mk"
          cp -r ../own/vendor_blobs/vendor "$V/"
          cp    ../own/vendor_blobs/X18-vendor.mk "$V/"
          { echo "--- 换用本机 blobs ---"
            echo "文件数: $(find $V -type f | wc -l)"
            echo "大小:   $(du -sh $V | cut -f1)"
            echo "保留的上游文件:"
            ls "$V"/Android.mk "$V"/BoardConfigVendor.mk 2>/dev/null | sed 's/^/  /'
            ls -d "$V"/libstagefright_color_conversion 2>/dev/null | sed 's/^/  /'
            echo "HAL 模块:"
            ls "$V"/vendor/lib/hw/ 2>/dev/null | sed 's/^/  /'
            echo "modem 固件:"
            ls "$V"/vendor/firmware/ 2>/dev/null | grep -E '^modem' | sed 's/^/  /'
            echo "vendor.mk 条目数: $(grep -c 'vendor/CUBOT/X18/' $V/X18-vendor.mk || echo 0)"
            echo; } | tee -a "$REPORT"
          # 关键 HAL 必须在，否则构出来的 ROM 一定起不来
          for f in camera.mt6737t.so sensors.mt6737t.so gralloc.mt6737t.so \
                   hwcomposer.mt6735.so audio.primary.mt6737t.so; do
            [ -s "$V/vendor/lib/hw/$f" ] || {
              echo "!! 缺少关键 HAL $f" | tee -a "$REPORT"; exit 1; }
          done
          [ -s "$V/vendor/lib/egl/libGLES_mali.so" ] || {
            echo "!! 缺少 Mali 驱动" | tee -a "$REPORT"; exit 1; }
          # 上游 Android.mk 声明的预编译模块，其源文件必须存在
          for f in libdpframework.so libaudiocustparam.so libmtkcam_fwkutils.so; do
            [ -s "$V/vendor/lib/$f" ] || {
              echo "!! 预编译模块源文件缺失 $f" | tee -a "$REPORT"; exit 1; }
          done
          [ -f "$V/Android.mk" ] || { echo "!! 上游 Android.mk 丢失" | tee -a "$REPORT"; exit 1; }
          echo "关键 HAL、Mali 驱动、预编译模块源文件均齐全" | tee -a "$REPORT"

      - name: Apply MTK patches
        run: |
          cd los/device/CUBOT/X18/patches
          chmod +x apply-patches.sh
          echo "--- apply-patches.sh 输出 ---" | tee -a "$REPORT"
          # 不再用管道掩盖退出码；即便失败也要把输出留下再决定是否中止
          set +e
          ./apply-patches.sh > /tmp/patch.log 2>&1
          rc=$?
          set -e
          tail -60 /tmp/patch.log | tee -a "$REPORT"
          echo "apply-patches.sh 退出码: $rc" | tee -a "$REPORT"
          echo | tee -a "$REPORT"
          [ $rc -eq 0 ] || echo "!! 补丁未完全成功，继续尝试构建以观察实际影响" | tee -a "$REPORT"

      - name: Apply our device overrides
        env:
          APPLY_TELEPHONY: ${{ github.event.inputs.apply_telephony || '1' }}
        run: |
          chmod +x own/lineage/apply-overrides.sh
          echo "--- 本机适配 ---" | tee -a "$REPORT"
          ./own/lineage/apply-overrides.sh "$PWD/los" "$PWD/own" 2>&1 | tee -a "$REPORT"
          echo | tee -a "$REPORT"

      # 单独一步验证 lunch 能否解析产品 —— 上次疑似死在这里
      - name: Verify lunch target
        run: |
          cd los
          export ALLOW_MISSING_DEPENDENCIES=true LC_ALL=C
          set +u
          source build/envsetup.sh > /tmp/envsetup.log 2>&1
          echo "--- envsetup ---" | tee -a "$REPORT"
          tail -20 /tmp/envsetup.log | tee -a "$REPORT"
          echo "--- 产品发现 ---" | tee -a "$REPORT"
          ls -l device/CUBOT/X18/AndroidProducts.mk | tee -a "$REPORT"
          set +e
          lunch lineage_X18-userdebug > /tmp/lunch.log 2>&1
          rc=$?
          set -e
          set -u
          echo "lunch 退出码: $rc" | tee -a "$REPORT"
          tail -30 /tmp/lunch.log | tee -a "$REPORT"
          echo | tee -a "$REPORT"
          if [ $rc -ne 0 ]; then
            echo "!! lunch 失败，无法继续构建" | tee -a "$REPORT"
            exit 1
          fi

      # Jack 服务器(2016 年的产物)用 HTTPS + TLSv1.0/1.1 与弱套件在 localhost 通信，
      # jack-admin 则用 curl 去连。Ubuntu 22.04 的 OpenSSL 3.0 默认 SECLEVEL=2
      # 直接禁用了这些老协议，握手必然失败 —— 表现为
      #   Communication error with Jack server (35)   ← curl 的 CURLE_SSL_CONNECT_ERROR
      #   SSL error when connecting to the Jack server
      # 而此时服务端其实活得好好的。这里给整条进程链一份放宽的 OpenSSL 配置。
      - name: Relax OpenSSL for Jack legacy TLS
        run: |
          cat > "$HOME/openssl-jack.cnf" <<'EOF'
          openssl_conf = openssl_init

          [openssl_init]
          ssl_conf = ssl_sect

          [ssl_sect]
          system_default = system_default_sect

          [system_default_sect]
          MinProtocol = TLSv1
          MaxProtocol = TLSv1.2
          CipherString = DEFAULT@SECLEVEL=0
          Options = UnsafeLegacyRenegotiation
          EOF
          # 写进 GITHUB_ENV 使其对后续所有步骤生效 ——
          # 关键是 make/ninja 派生出的 jack-admin 与 curl 也必须继承到
          echo "OPENSSL_CONF=$HOME/openssl-jack.cnf" >> "$GITHUB_ENV"

          # 上一次只设 OPENSSL_CONF 无效。curl 会自动读取 ~/.curlrc，
          # 这是不改 jack-admin 脚本就能覆盖其内部所有 curl 调用的注入点。
          # 用 printf 而非 heredoc —— heredoc 内容必须顶格，但那会低于
          # YAML 块标量的缩进基准从而截断整个块（本文件已因此坏过一次）。
          printf '%s\n' \
            'ciphers = DEFAULT@SECLEVEL=0' \
            'tls-max = 1.2' \
            'insecure' > "$HOME/.curlrc"
          { echo "--- OpenSSL / curl 放宽配置 ---"
            echo "OPENSSL_CONF=$HOME/openssl-jack.cnf"
            echo "~/.curlrc:"; sed 's/^/    /' "$HOME/.curlrc"
            openssl version
            curl --version | head -2
            echo; } | tee -a "$REPORT"

      # 探测证实：服务端监听正常，但客户端发出 ClientHello 后被直接断开
      # （unexpected eof），说明失败发生在服务端 Java 侧而非 OpenSSL 侧。
      # 原因：Java 8u291+ 在 jdk.tls.disabledAlgorithms 里默认禁用了
      # TLSv1/TLSv1.1，而 Jack(2016) 的服务端依赖它们。我们用的是 8u502，
      # 所以服务器能起来能监听，但任何握手都会被 JDK 安全策略掐断。
      # 这也解释了为何改 OPENSSL_CONF 与 ~/.curlrc 都无效。
      - name: Relax JDK 8 TLS policy for Jack
        run: |
          JS=$(find "$JAVA_HOME" -name java.security -path '*security*' 2>/dev/null | head -1)
          if [ -z "$JS" ]; then echo "!! 找不到 java.security" | tee -a "$REPORT"; exit 1; fi
          cp "$JS" "$JS.bak"
          # 属性值可能以反斜杠跨多行，用 python 整体替换而非 sed 单行替换
          python3 - "$JS" <<'PYEOF'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8', errors='replace').read()
          for key, val in (
              ('jdk.tls.disabledAlgorithms', 'SSLv3, RC4, DES, MD5withRSA, NULL, EXPORT'),
              ('jdk.certpath.disabledAlgorithms', 'MD2, MD5'),
              ('jdk.tls.legacyAlgorithms', ''),
          ):
              s = re.sub(r'^' + re.escape(key) + r'=(?:.*\\\n)*.*$',
                         key + '=' + val, s, flags=re.M)
          open(p, 'w', encoding='utf-8').write(s)
          print('已重写:', p)
          PYEOF
          { echo "--- JDK TLS 策略 ---"
            echo "文件: $JS"
            grep -E '^jdk\.(tls|certpath)\.(disabled|legacy)Algorithms' "$JS"
            echo; } | tee -a "$REPORT"

      # Android 7.x 用 Jack 编译 Java（8.0 起才换回 javac）。它是个后台服务，
      # 在 CI 里经常起不来 —— 上一次就是 FAILED: [code=47] setup-jack-server。
      # 之前把 jack-admin 的输出丢进 /dev/null 且加 || true，等于把原因也丢了。
      - name: Setup Jack server
        run: |
          cd los
          export JACK_SERVER_VM_ARGUMENTS="-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx8g -Djava.security.egd=file:/dev/./urandom"
          JA=./prebuilts/sdk/tools/jack-admin
          echo "--- Jack 服务器初始化 ---" | tee -a "$REPORT"
          { echo "JAVA_HOME: ${JAVA_HOME:-未设置}"; java -version 2>&1 | head -1; } | tee -a "$REPORT"

          set +e
          $JA kill-server > /tmp/jack.log 2>&1
          # 清干净重来，避免残留的证书/端口配置作祟
          rm -rf ~/.jack-server ~/.jack-settings

          # install-server 只接受恰好两个参数：<launcher.jar> <server.jar>。
          # 上一次用通配符匹配到多个 jar（还含 launcher 自身）导致用法错误 rc=255。
          # launcher 在 prebuilts/sdk/tools/ 下，server jar 才在 jacks/ 子目录里。
          { echo "--- 可用的 jack jar ---"
            find prebuilts/sdk/tools -maxdepth 2 -name 'jack*.jar' -printf '%p  %s bytes\n' 2>/dev/null
          } >> /tmp/jack.log 2>&1

          LAUNCHER=$(find prebuilts/sdk/tools -maxdepth 2 -name 'jack-launcher.jar' | head -1)
          SERVER=$(find prebuilts/sdk/tools -maxdepth 2 -name 'jack*.jar' \
                     ! -name 'jack-launcher.jar' | sort -V | tail -1)
          echo "launcher = ${LAUNCHER:-未找到}" >> /tmp/jack.log
          echo "server   = ${SERVER:-未找到}"   >> /tmp/jack.log

          echo "--- install-server ---" >> /tmp/jack.log
          $JA install-server "$LAUNCHER" "$SERVER" >> /tmp/jack.log 2>&1
          echo "install-server rc=$?" >> /tmp/jack.log

          echo "--- start-server ---" >> /tmp/jack.log
          $JA start-server >> /tmp/jack.log 2>&1
          start_rc=$?
          echo "start-server rc=$start_rc" >> /tmp/jack.log
          sleep 5

          # 4 核 16GB 上并发编译多个 jack 服务极易 OOM，限制为 1
          if [ -f ~/.jack-server/config.properties ]; then
            if grep -q '^jack.server.max-service=' ~/.jack-server/config.properties; then
              sed -i 's/^jack.server.max-service=.*/jack.server.max-service=2/' ~/.jack-server/config.properties
            else
              echo 'jack.server.max-service=2' >> ~/.jack-server/config.properties
            fi
            $JA stop-server  >> /tmp/jack.log 2>&1
            sleep 2
            $JA start-server >> /tmp/jack.log 2>&1
            echo "重启后 start-server rc=$?" >> /tmp/jack.log
            sleep 5
          fi

          echo "--- list-server ---" >> /tmp/jack.log
          $JA list-server >> /tmp/jack.log 2>&1
          list_rc=$?
          echo "list-server rc=$list_rc" >> /tmp/jack.log
          set -e

          cat /tmp/jack.log | tee -a "$REPORT"
          { echo "--- ~/.jack-server 内容 ---"
            ls -la ~/.jack-server 2>&1 || echo "(目录不存在)"
            echo "--- config.properties ---"
            cat ~/.jack-server/config.properties 2>&1 | grep -v -i 'password\|key' || echo "(无)"
            echo; } | tee -a "$REPORT"

          if [ $list_rc -ne 0 ]; then
            echo "!! Jack 服务器未就绪，构建无法继续。" | tee -a "$REPORT"
            # 实测 ANDROID_COMPILE_WITH_JACK=false 在这棵树上不可用：
            # 退回 javac 后 ninja 会报 with-local/classes.dex missing and no
            # known rule（javac 路径未生成对应规则），所以不再做这个回退。
            exit 1
          fi

      # 前两轮的 SSL 失败都只看到 jack-admin 转述的 "SSL error"，
      # 拿不到底层握手细节。这里直接探测，把真实原因固定下来。
      - name: Probe Jack TLS connection
        run: |
          cd los
          PORT=$(grep -oP '^jack.server.service.port=\K[0-9]+' ~/.jack-server/config.properties 2>/dev/null || echo 8076)
          ADMIN=$(grep -oP '^jack.server.admin.port=\K[0-9]+' ~/.jack-server/config.properties 2>/dev/null || echo 8077)
          { echo "--- Jack TLS 探测 (service=$PORT admin=$ADMIN) ---"
            echo "[1] 端口监听:"; ss -ltnp 2>/dev/null | grep -E ":$PORT|:$ADMIN" || echo "  未监听"
            echo "[2] openssl s_client 握手:"
            timeout 15 openssl s_client -connect 127.0.0.1:$ADMIN -brief </dev/null 2>&1 | head -20 || true
            echo "[3] curl 冗余输出(带 ~/.curlrc):"
            timeout 20 curl -sv "https://127.0.0.1:$ADMIN/" 2>&1 | grep -aE "SSL|TLS|cipher|certificate|error|Connected|HTTP" | head -20 || true
            echo "[4] curl 显式旧协议:"
            timeout 20 curl -sv --tlsv1 --tls-max 1.2 --ciphers 'ALL:@SECLEVEL=0' -k \
              "https://127.0.0.1:$ADMIN/" 2>&1 | grep -aE "SSL|TLS|cipher|error|Connected|HTTP" | head -15 || true
            echo "[5] jack-admin list-server 复测:"
            ./prebuilts/sdk/tools/jack-admin list-server 2>&1 | head -5 || true
            echo; } | tee -a "$REPORT"

      # 构建到 90% 时死在 WebView 的 APK 签名上：
      #   java.util.zip.ZipException: error in opening zip file (SignApk)
      # external/chromium-webview 里放的是几十 MB 的预编译 APK，
      # 浅克隆(--depth=1 --no-clone-bundle)容易把它取成损坏或占位文件。
      # 这里逐个校验，坏了就把该仓库单独完整重取。
      - name: Verify and repair WebView prebuilt
        run: |
          set +e   # 这一步是尽力修复，不应因单条探测命令非零而中止整个构建
          cd los
          WV=external/chromium-webview
          { echo "--- WebView 预编译校验 ---"
            if [ ! -d "$WV" ]; then echo "!! $WV 不存在"; else
              ls -lh "$WV"/prebuilt/*/*.apk 2>/dev/null || echo "(未找到 apk)"
              bad=0
              for f in "$WV"/prebuilt/*/*.apk; do
                [ -f "$f" ] || continue
                if unzip -tqq "$f" >/dev/null 2>&1; then
                  echo "  OK   $f  ($(stat -c%s "$f") bytes)"
                else
                  echo "  损坏 $f  ($(stat -c%s "$f") bytes)  头部: $(head -c 16 "$f" | od -An -c | tr -s ' ')"
                  bad=1
                fi
              done
              if [ "$bad" = "1" ] || [ -z "$(ls "$WV"/prebuilt/*/*.apk 2>/dev/null)" ]; then
                echo "  -> 完整重取 $WV"
                rm -rf "$WV"
                git clone --depth=1 https://github.com/LineageOS/android_external_chromium-webview \
                  -b cm-14.1 "$WV" 2>&1 | tail -5
                for f in "$WV"/prebuilt/*/*.apk; do
                  [ -f "$f" ] || continue
                  unzip -tqq "$f" >/dev/null 2>&1 \
                    && echo "  重取后 OK   $f ($(stat -c%s "$f") bytes)" \
                    || echo "  重取后仍坏 $f"
                done
              fi
            fi
            echo; } | tee -a "$REPORT"

      - name: Build
        run: |
          cd los
          export LC_ALL=C
          # 不再无条件设 ALLOW_MISSING_DEPENDENCIES。它会把有缺失依赖的模块
          # 静默剔除，但引用其生成产物的模块仍保留 —— 上一次就是
          # org.cyanogenmod.platform-res 未被调度，而依赖它 Manifest.java 的
          # org.cyanogenmod.platform.internal 照编不误，最终 javac: file not found。
          if [ "${{ github.event.inputs.allow_missing_deps || '0' }}" = "1" ]; then
            export ALLOW_MISSING_DEPENDENCIES=true
            echo "ALLOW_MISSING_DEPENDENCIES=true (显式开启)" | tee -a "$REPORT"
          fi
          export USE_CCACHE=1 CCACHE_DIR=~/.ccache
          ccache -M 8G > /dev/null
          export JACK_SERVER_VM_ARGUMENTS="-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx8g -Djava.security.egd=file:/dev/./urandom"
          set +u
          source build/envsetup.sh > /dev/null 2>&1
          lunch lineage_X18-userdebug > /dev/null 2>&1
          set -u

          TARGET="${{ github.event.inputs.build_target || 'bacon' }}"
          JA=./prebuilts/sdk/tools/jack-admin

          # Jack 服务器在长时间构建中掉线是 Android 7.x 的老毛病，
          # 表现为 ninja 报 FAILED: [code=47] setup-jack-server
          # （该码来自 AOSP 构建脚本里的 `jack-admin start-server || exit 47`）。
          # out/ 与 ccache 都在，增量重试很便宜，所以失败就重启 Jack 再来一次。
          rc=1
          for attempt in 1 2 3; do
            echo "===== 构建尝试 $attempt/3  target=$TARGET  $(date -u +%H:%M:%S) =====" | tee -a "$REPORT"
            if [ $attempt -gt 1 ]; then
              set +e
              $JA kill-server  > /dev/null 2>&1
              sleep 3
              $JA start-server > /tmp/jack_restart.log 2>&1
              echo "重启 Jack rc=$?" | tee -a "$REPORT"
              sleep 5
              set -e
            fi

            # cm-14.1 上 org.cyanogenmod.platform.internal 会直接引用
            # org.cyanogenmod.platform-res 生成的 Manifest.java，却没有对该模块
            # 建立 ninja 依赖，导致 -res 从未被调度、编到 34% 时 javac 找不到文件。
            # 先把 -res 单独编出来，把生成产物落地。
            if [ $attempt -eq 1 ]; then
              set +e
              make -j"$(nproc)" org.cyanogenmod.platform-res > /tmp/prebuild.log 2>&1
              pre_rc=$?
              set -e
              echo "预编译 org.cyanogenmod.platform-res rc=$pre_rc" | tee -a "$REPORT"
              { echo "--- 预编译输出末尾 ---"
                grep -aE "^FAILED|^ninja: error|error:|Manifest\.java" /tmp/prebuild.log | head -15 || true
                tail -8 /tmp/prebuild.log; } | tee -a "$REPORT"
              MF=out/target/common/obj/APPS/org.cyanogenmod.platform-res_intermediates/src/cyanogenmod/platform/Manifest.java
              if [ -f "$MF" ]; then
                echo "Manifest.java 已生成 ($(stat -c%s "$MF") bytes)" | tee -a "$REPORT"
              else
                echo "!! Manifest.java 仍未生成" | tee -a "$REPORT"
                find out/target/common/obj/APPS/org.cyanogenmod.platform-res_intermediates -type f 2>/dev/null | head -10 | tee -a "$REPORT" || true
              fi
            fi

            set +e
            make -j"$(nproc)" "$TARGET" > /tmp/build.log 2>&1
            rc=$?
            set -e
            echo "make 退出码: $rc  $(date -u +%H:%M:%S)" | tee -a "$REPORT"
            [ $rc -eq 0 ] && break
            # 只有 Jack 掉线才值得重试；真正的编译错误重试也没用
            grep -q 'setup-jack-server' /tmp/build.log || {
              echo "非 Jack 故障，不再重试" | tee -a "$REPORT"; break; }
          done

          { echo "--- 错误摘要 ---"
            grep -aE "(^|[^-])error:|^FAILED|^ninja: error|^make: \*\*\*|Killed|No space left" /tmp/build.log \
              | grep -avE "^prebuilts/|clang\+\+|-Werror|-Wno-" | head -30 || echo "(无)"
            echo "--- FAILED 前后各 15 行 ---"
            grep -an "^FAILED" /tmp/build.log | head -3 | cut -d: -f1 | while read -r n; do
              sed -n "$((n>10?n-10:1)),$((n+60))p" /tmp/build.log
              echo "  ......"
            done
            echo "--- Jack 服务端日志 ---"
            $JA server-log 2>&1 | tail -40 || echo "(取不到)"
            ls -la ~/.jack-server/logs/ 2>/dev/null | head -10 || true
            # 服务端日志很大(百KB级)，直接挑错误行；模块编译失败的真因在这里
            echo "--- Jack 日志中的错误 ---"
            grep -ahE 'SEVERE|ERROR|OutOfMemory|GC overhead|Exception|Internal compiler' \
              ~/.jack-server/logs/*.log 2>/dev/null | tail -30 || echo "(无错误行)"
            for f in ~/.jack-server/logs/*.log; do
              [ -f "$f" ] && { echo "== $f 末尾 =="; tail -15 "$f"; }
            done 2>/dev/null || true
            echo "--- Jack 存活检查 ---"
            $JA list-server 2>&1 | head -5 || echo "(服务器已死)"
            echo "--- 日志总行数: $(wc -l < /tmp/build.log) ---"
            echo; } | tee -a "$REPORT"
          # 报告里的截取窗口总被超长的 ninja 命令行挤爆，索性把完整日志
          # 压缩后一并作为 Release 资产发布，便于离线分析。
          gzip -9 -c /tmp/build.log > "$GITHUB_WORKSPACE/build-log.txt.gz" || true
          ls -lh "$GITHUB_WORKSPACE/build-log.txt.gz" || true
          exit $rc

      - name: Collect results
        if: always()
        run: |
          OUT=los/out/target/product/X18
          { echo "--- 产物 ---"
            if [ -d "$OUT" ]; then
              ls -lh "$OUT" 2>/dev/null | head -30
            else
              echo "!! $OUT 不存在 —— 构建未产出任何东西"
            fi
            echo
            echo "--- 磁盘 ---"; df -h / | tail -1
            echo "--- ccache ---"; ccache -s 2>/dev/null | head -6 || true
          } | tee -a "$REPORT"
          if [ -f "$OUT/boot.img" ]; then
            echo "--- boot.img 内核校验 ---" | tee -a "$REPORT"
            python3 own/tools/verify_recovery.py "$OUT/boot.img" 2>&1 | tee -a "$REPORT" || true
          fi

      # 无论成败都发布，这样读不到日志也能拿到诊断
      - name: Publish report and artifacts
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: los141-build-${{ github.run_number }}
          name: LineageOS 14.1 for ios6737t (build ${{ github.run_number }})
          files: |
            build-report.txt
            build-log.txt.gz
            los/out/target/product/X18/*.zip
            los/out/target/product/X18/boot.img
            los/out/target/product/X18/system.img
          fail_on_unmatched_files: false
          body: |
            LineageOS 14.1 (Android 7.1)，为 MT6737T 机型 `ios6737t_36_a_n` 构建。
            基于 [seluce/android_device_cubot_x18](https://github.com/seluce/android_device_cubot_x18)。

            **构建结论: ${{ job.status }}** —— 详见 `build-report.txt`。

            ⚠️ vendor blobs 目前取自 Cubot X18，其 modem 固件为 `modem_1_lwg_n.img`
            （LTE/WCDMA/GSM，无 C2K），而本机是国行双基带（MD1 + MD3/CDMA）。
            **通话与移动数据预期不可用**；相机传感器型号也不同，预期异常。
            这些需换用本机 blobs 修复。刷入前务必先用 TWRP 完整备份。
