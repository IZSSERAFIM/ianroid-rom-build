name: Build TWRP (ios6737t / MT6737T)

# Android 7.1 时代的构建对环境很挑：需要 JDK 8 与 Python 2，两者在新版
# Ubuntu runner 上都不是默认可用。这里用 setup-java 提供 JDK 8，
# 用 universe 源里的 python2 提供 Python 2。
# 若某天该 runner 标签被 GitHub 下线，改 inputs.runner 即可。

on:
  # 手动触发，可指定 runner 与 manifest 分支
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner 标签"
        required: true
        default: "ubuntu-22.04"
      manifest_branch:
        description: "TWRP manifest 分支"
        required: true
        default: "twrp-7.1"
  # 设备树或 workflow 变更时自动重建（其他文件如 README 改动不会触发）
  push:
    branches: [main]
    paths:
      - "device/**"
      - ".github/workflows/build-twrp.yml"

env:
  DEFAULT_MANIFEST_BRANCH: twrp-7.1

jobs:
  build:
    name: Build recovery
    # push 事件下 inputs 为空，回落到默认值
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-22.04' }}
    timeout-minutes: 350
    permissions:
      contents: write   # 发布 Release 需要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AOSP 源码 + out 目录约需 40GB，runner 默认只有约 29GB 可用，
      # 必须先腾出预装的 Android SDK / .NET / GHC / CodeQL 等。
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Report disk after cleanup
        run: df -h /

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python2 python3 openssl \
            libelf-dev device-tree-compiler
          # AOSP 7.1 的构建脚本调用 `python` 时期望的是 Python 2
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          python --version

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP minimal manifest
        run: |
          git config --global user.name  "github-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false
          mkdir -p twrp && cd twrp
          repo init --depth=1 --no-repo-verify \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b "${{ github.event.inputs.manifest_branch || env.DEFAULT_MANIFEST_BRANCH }}"
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune

      - name: Report disk after sync
        run: df -h / && du -sh twrp

      - name: Install device tree
        run: |
          mkdir -p twrp/device/ianroid/ios6737t
          cp -v device/* twrp/device/ianroid/ios6737t/
          echo "--- 设备树内容 ---"
          ls -l twrp/device/ianroid/ios6737t/

      - name: Build recoveryimage
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          set +u
          source build/envsetup.sh
          lunch omni_ios6737t-eng
          set -u
          mka recoveryimage -j"$(nproc)"

      - name: Show output
        if: always()
        run: |
          OUT=twrp/out/target/product/ios6737t
          echo "--- out 产物 ---"
          ls -lh "$OUT" 2>/dev/null || echo "(无产物)"
          if [ -f "$OUT/recovery.img" ]; then
            echo "--- recovery.img 校验 ---"
            stat -c '大小: %s bytes' "$OUT/recovery.img"
            md5sum "$OUT/recovery.img"
            echo -n "魔数: "; head -c 8 "$OUT/recovery.img"; echo
            # 确认打包进去的是我们的 prebuilt 内核而不是别的
            echo -n "内核 banner: "
            python3 - "$OUT/recovery.img" <<'PY'
import struct, sys, zlib, re
d = open(sys.argv[1], 'rb').read()
ks, ka, rs, ra, ss, sa, tg, ps = struct.unpack_from('<8I', d, 8)
k = d[ps:ps+ks]
m = re.search(b'\x1f\x8b\x08', k)
raw = zlib.decompressobj(16+zlib.MAX_WBITS).decompress(k[m.start():]) if m else k
b = re.search(rb'Linux version [0-9][^\x00\n]{0,120}', raw)
print(b.group().decode() if b else '(未找到)')
print(f"  base=0x{ka-0x8000:08X} kernel=0x{ka:08X} ramdisk=0x{ra:08X} tags=0x{tg:08X} page={ps}")
for kw in (b'st7703', b'gt1x', b'Goodix'):
    print(f"  含 {kw.decode():<8}: {kw in raw}")
PY
          fi
          df -h /

      - name: Upload recovery.img
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-ios6737t-recovery
          path: twrp/out/target/product/ios6737t/recovery.img
          if-no-files-found: error

      # 同时发布 Release —— artifacts 下载需要认证，Release 资产则可公开直链下载
      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twrp-build-${{ github.run_number }}
          name: TWRP for ios6737t (build ${{ github.run_number }})
          files: twrp/out/target/product/ios6737t/recovery.img
          body: |
            TWRP recovery，为 MT6737T 机型 `ios6737t_36_a_n` 构建。

            - 内核：本机 stock prebuilt（含 `st7703` 屏驱动 + `gt1x` 触摸驱动）
            - `TW_ROTATION := 180`，用于修正物理倒装屏
            - fstab 依据本机实测 by-name 分区表生成，`/data` 无 forceencrypt

            **刷入前务必先试运行，不要直接写分区：**
            ```
            fastboot boot recovery.img
            ```
            确认显示方向与触摸正常后，再考虑 `fastboot flash recovery`。

      # 失败时把构建日志带出来，便于定位（完整 out 目录太大，只取日志）
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            twrp/out/**/*.log
            twrp/out/verbose.log.gz
          if-no-files-found: ignore
          retention-days: 7
